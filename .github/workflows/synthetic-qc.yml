name: BASICS synthetic mask QC
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-mask-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Install isolated public requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Synthetic mask QC and matte QC tests
        run: python -B -m pytest -q tests/test_maskgate.py tests/test_matteqc.py tests/test_qc_overlay.py tests/test_maskgate_bitdepth.py tests/test_matteqc_rough_bitdepth.py
